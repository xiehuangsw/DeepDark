name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请说明你**想解决什么问题**，而不只是想要什么按钮——
        这样更容易找到合适的做法。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      placeholder: 例如：晚上用外接显示器时，最低亮度还是太亮……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你的想法（可选）
      description: 如果有具体设想，比如界面放哪、怎么操作
    validations:
      required: false

  - type: textarea
    id: alternative
    attributes:
      label: 现在是怎么绕过的（可选）
      description: 目前你用别的方法怎么达到类似效果
    validations:
      required: false
